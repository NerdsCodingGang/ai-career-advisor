#   estimated_level: null
#     # JUNIOR | REGULAR | SENIOR | LEAD | STAFF | PRINCIPAL | UNKNOWN
#     # (Mid / Intermediate / … are aliases → REGULAR — do not store MID)
#   confidence: UNKNOWN             # LOW | MEDIUM | HIGH | UNKNOWN
#   rationale: null                 # cite scope + experiences — not title/years alone
#   evidence_experience_ids: []
#   scope_rollup:
